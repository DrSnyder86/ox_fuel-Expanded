name: Create release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build resource archive
        shell: bash
        run: |
          mkdir -p dist/ox_fuel
          cp LICENSE README.md CHANGELOG.md THIRD_PARTY_NOTICES.md fxmanifest.lua config.lua server.lua \
            electric_profiles.lua fuel_grades.lua nozzle_offsets.lua vehicle_profiles.lua dist/ox_fuel/
          cp -r assets client data locales stream web dist/ox_fuel/
          cd dist
          zip -r "../ox_fuel-expanded-${GITHUB_REF_NAME}.zip" ox_fuel

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: ox_fuel-expanded-${{ github.ref_name }}.zip
